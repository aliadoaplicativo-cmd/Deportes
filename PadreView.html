<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <!-- Evitar zoom indeseado al tocar rápido los botones en móviles -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Registro en Vivo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Optimizaciones para táctil */
        button { touch-action: manipulation; }
        .btn-evento { transition: transform 0.1s; }
        .btn-evento:active { transform: scale(0.95); }
    </style>
</head>
<body class="bg-gray-900 text-white min-h-screen flex flex-col">

    <!-- Cronómetro Superior -->
    <header class="bg-gray-800 p-4 text-center shadow-lg sticky top-0 z-50">
        <h1 class="text-gray-400 text-sm font-bold uppercase tracking-wider mb-1">Tiempo de Juego</h1>
        <div class="text-5xl font-mono font-bold text-green-400" id="cronometro">00:00</div>
        <div class="mt-4 flex justify-center gap-4">
            <button onclick="iniciarCronometro()" class="bg-green-600 px-6 py-2 rounded-full font-bold">Iniciar</button>
            <button onclick="pausarCronometro()" class="bg-yellow-600 px-6 py-2 rounded-full font-bold">Pausa</button>
        </div>
    </header>

    <!-- Selector de Jugador -->
    <div class="p-4 flex-1">
        <label class="block text-gray-300 text-sm mb-2">Seleccione al jugador involucrado:</label>
        <select id="selector-jugador" class="w-full bg-gray-700 text-white p-4 rounded-xl mb-6 text-lg focus:outline-none">
            <option value="">-- Seleccionar Jugador --</option>
            <!-- Opciones cargadas por JS -->
        </select>

        <!-- Botonera de Eventos (Grandes y claros para el celular) -->
        <div class="grid grid-cols-2 gap-4">
            <button onclick="registrar('Gol')" class="btn-evento bg-blue-600 hover:bg-blue-500 p-6 rounded-xl flex flex-col items-center shadow-lg">
                <span class="text-4xl mb-2">⚽</span>
                <span class="font-bold text-lg">Gol A Favor</span>
            </button>
            
            <button onclick="registrar('Sustitucion_Entra')" class="btn-evento bg-indigo-600 hover:bg-indigo-500 p-6 rounded-xl flex flex-col items-center shadow-lg">
                <span class="text-4xl mb-2">🔄</span>
                <span class="font-bold text-lg">Cambio (Entra)</span>
            </button>

            <button onclick="registrar('Tarjeta Amarilla')" class="btn-evento bg-yellow-500 hover:bg-yellow-400 p-6 rounded-xl flex flex-col items-center shadow-lg text-gray-900">
                <span class="text-4xl mb-2">🟨</span>
                <span class="font-bold text-lg">T. Amarilla</span>
            </button>

            <button onclick="registrar('Tarjeta Roja')" class="btn-evento bg-red-600 hover:bg-red-500 p-6 rounded-xl flex flex-col items-center shadow-lg">
                <span class="text-4xl mb-2">🟥</span>
                <span class="font-bold text-lg">T. Roja</span>
            </button>
        </div>
        
        <div id="estado-mensaje" class="mt-6 text-center text-sm font-bold text-green-400 h-6"></div>
    </div>

    <script>
        // El token viene desde el backend vía Scriptlets, aquí lo leemos
        const TOKEN = "<?= token ?>"; 
        
        let segundos = 0;
        let intervalo = null;

        // Carga inicial
        window.onload = function() {
            google.script.run.withSuccessHandler(jugadores => {
                const select = document.getElementById('selector-jugador');
                jugadores.forEach(j => {
                    select.innerHTML += `<option value="${j.dni}">${j.nombre}</option>`;
                });
            }).obtenerJugadoresEncuentro(TOKEN);
        };

        // Lógica del Cronómetro
        function actualizarPantalla() {
            let m = Math.floor(segundos / 60).toString().padStart(2, '0');
            let s = (segundos % 60).toString().padStart(2, '0');
            document.getElementById('cronometro').innerText = `${m}:${s}`;
        }
        
        function iniciarCronometro() {
            if(!intervalo) intervalo = setInterval(() => { segundos++; actualizarPantalla(); }, 1000);
        }
        
        function pausarCronometro() {
            clearInterval(intervalo);
            intervalo = null;
        }

        // Enviar datos
        function registrar(tipoEvento) {
            const dni = document.getElementById('selector-jugador').value;
            const minuto = Math.floor(segundos / 60);
            
            if(!dni) {
                alert("Por favor seleccione un jugador primero.");
                return;
            }

            const msg = document.getElementById('estado-mensaje');
            msg.innerText = "Registrando...";
            msg.className = "mt-6 text-center text-sm font-bold text-yellow-400 h-6";

            google.script.run.withSuccessHandler(() => {
                msg.innerText = `${tipoEvento} registrado en el minuto ${minuto}!`;
                msg.className = "mt-6 text-center text-sm font-bold text-green-400 h-6";
                document.getElementById('selector-jugador').value = ''; // Resetear selector
                setTimeout(() => msg.innerText = "", 3000);
            }).withFailureHandler(err => {
                msg.innerText = "Error: " + err.message;
                msg.className = "mt-6 text-center text-sm font-bold text-red-500 h-6";
            }).registrarEventoEnVivo(TOKEN, minuto, tipoEvento, dni);
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mesa de Control - En Vivo</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen pb-24">

<script>
    const URL_BACKEND = "https://script.google.com/macros/s/AKfycbxZ3I-TpP19nuQ5Lls_kEVi1CL7Fqg2V3-hY7yeYBgbCCU9nAkbtS2xOpkHEzmKTC2hQg/exec";
    const urlParams = new URLSearchParams(window.location.search);
    const TOKEN = urlParams.get('token') || "";
    const STORAGE_KEY = TOKEN ? `mesa_control_${TOKEN}` : "";

    let estado = {
        rival: "Rival",
        jugadores: [],          // { dni, nombre, camiseta, fotoUrl, enCancha: bool, titularInicial: bool }
        eventos: [],            // { id, tiempo, minuto, tipo, dni, nombre, dniEntra?, nombreEntra? }
        golesPropio: 0,
        golesRival: 0,
        fase: "PREVIA",         // PREVIA | 1T | ENTRETIEMPO | 2T | FINALIZADO
        segundos: 0,
        inicioPeriodoMs: null,  // Hora exacta (Date.now()) de inicio del tiempo actual
        timerInterval: null,
        jugadorActivoDni: null
    };

    let wakeLock = null;

    // ==========================================
    // PERSISTENCIA LOCAL (RESPALDO ANTE BLOQUEO/RECARGA)
    // ==========================================
    function guardarEstadoLocal() {
        if (!STORAGE_KEY) return;
        try {
            const copia = {
                rival: estado.rival,
                jugadores: estado.jugadores,
                eventos: estado.eventos,
                golesPropio: estado.golesPropio,
                golesRival: estado.golesRival,
                fase: estado.fase,
                segundos: estado.segundos,
                inicioPeriodoMs: estado.inicioPeriodoMs
            };
            localStorage.setItem(STORAGE_KEY, JSON.stringify(copia));
        } catch (e) {}
    }

    function cargarEstadoLocal() {
        if (!STORAGE_KEY) return null;
        try {
            const raw = localStorage.getItem(STORAGE_KEY);
            return raw ? JSON.parse(raw) : null;
        } catch (e) {
            return null;
        }
    }

    function limpiarEstadoLocal() {
        if (!STORAGE_KEY) return;
        try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
    }

    // ==========================================
    // MANTENER PANTALLA ENCENDIDA (WAKE LOCK)
    // ==========================================
    async function activarWakeLock() {
        try {
            if ('wakeLock' in navigator && !wakeLock) {
                wakeLock = await navigator.wakeLock.request('screen');
                wakeLock.addEventListener('release', () => { wakeLock = null; });
            }
        } catch (e) {}
    }

    async function liberarWakeLock() {
        try {
            if (wakeLock) {
                await wakeLock.release();
                wakeLock = null;
            }
        } catch (e) {}
    }

    // Recalcular reloj exacto al desbloquear el celular o volver a la pestaña
    document.addEventListener("visibilitychange", () => {
        if (!document.hidden && (estado.fase === "1T" || estado.fase === "2T")) {
            actualizarReloj();
            activarWakeLock();
        }
    });

    window.onload = async () => {
        if (!TOKEN) {
            mostrarErrorPantalla("Enlace inválido. Falta el código (token) del partido.");
            return;
        }
        try {
            const resVal = await fetch(`${URL_BACKEND}?action=validarToken&token=${encodeURIComponent(TOKEN)}`);
            const dataVal = await resVal.json();
            if (!dataVal.valido) {
                limpiarEstadoLocal();
                mostrarErrorPantalla("Este enlace ya fue cerrado o no es válido.");
                return;
            }

            const resConv = await fetch(`${URL_BACKEND}?action=obtenerConvocados&token=${encodeURIComponent(TOKEN)}`);
            const dataConv = await resConv.json();
            if (dataConv.error) throw new Error(dataConv.error);

            const guardado = cargarEstadoLocal();
            if (guardado && Array.isArray(guardado.jugadores) && guardado.jugadores.length > 0) {
                estado.rival = guardado.rival || dataConv.rival || "Rival";
                estado.jugadores = guardado.jugadores;
                estado.eventos = guardado.eventos || [];
                estado.golesPropio = guardado.golesPropio || 0;
                estado.golesRival = guardado.golesRival || 0;
                estado.fase = guardado.fase || "PREVIA";
                estado.segundos = guardado.segundos || 0;
                estado.inicioPeriodoMs = guardado.inicioPeriodoMs || null;
            } else {
                estado.rival = dataConv.rival || "Rival";
                estado.jugadores = (dataConv.jugadores || []).map(j => ({
                    ...j,
                    dni: j.dni.toString().trim(),
                    enCancha: false,
                    titularInicial: false
                }));
            }

            document.getElementById("lblRivalMarcador").innerText = estado.rival;
            document.getElementById("loaderView").classList.add("hidden");
            document.getElementById("appView").classList.remove("hidden");

            if ((estado.fase === "1T" || estado.fase === "2T") && estado.inicioPeriodoMs) {
                iniciarTimer(false);
            }
            renderTodo();
        } catch (e) {
            mostrarErrorPantalla("Error al cargar el partido: " + e.message);
        }
    };

    function mostrarErrorPantalla(msg) {
        document.getElementById("loaderView").innerHTML = `
            <div class="bg-red-950/60 border border-red-700 p-6 rounded-2xl max-w-xs mx-auto text-center">
                <p class="text-3xl mb-2">⚠️</p>
                <p class="text-sm font-bold text-red-200">${msg}</p>
            </div>`;
    }

    function mostrarAlerta(msg) {
        document.getElementById("alertaTexto").innerText = msg;
        document.getElementById("modalAlerta").classList.replace("hidden", "flex");
    }
    function cerrarAlerta() {
        document.getElementById("modalAlerta").classList.replace("flex", "hidden");
    }

    // ==========================================
    // CONTROL DE TIEMPOS Y CRONÓMETRO (BASADO EN HORA REAL)
    // ==========================================
    function formatReloj(seg) {
        const m = Math.floor(seg / 60).toString().padStart(2, '0');
        const s = (seg % 60).toString().padStart(2, '0');
        return `${m}:${s}`;
    }

    function actualizarReloj() {
        if (estado.inicioPeriodoMs) {
            estado.segundos = Math.max(0, Math.floor((Date.now() - estado.inicioPeriodoMs) / 1000));
        }
        const el = document.getElementById("relojDisplay");
        if (el) el.innerText = formatReloj(estado.segundos);
    }

    function minutoActual() {
        if (estado.inicioPeriodoMs) actualizarReloj();
        return Math.max(1, Math.floor(estado.segundos / 60) + 1);
    }

    function avanzarFase() {
        if (estado.fase === "PREVIA") {
            const titulares = estado.jugadores.filter(j => j.enCancha);
            if (titulares.length === 0) return mostrarAlerta("Primero marque a los jugadores Titulares tocándolos en la lista de Suplentes.");
            estado.jugadores.forEach(j => { j.titularInicial = j.enCancha; });
            estado.fase = "1T";
            estado.segundos = 0;
            iniciarTimer(true);
        } else if (estado.fase === "1T") {
            detenerTimer();
            estado.fase = "ENTRETIEMPO";
        } else if (estado.fase === "ENTRETIEMPO") {
            estado.fase = "2T";
            estado.segundos = 0;
            iniciarTimer(true);
        } else if (estado.fase === "2T") {
            detenerTimer();
            estado.fase = "FINALIZADO";
            abrirModalCierre();
        }
        guardarEstadoLocal();
        renderTodo();
    }

    function iniciarTimer(reiniciarInicio = true) {
        if (estado.timerInterval) clearInterval(estado.timerInterval);
        if (reiniciarInicio || !estado.inicioPeriodoMs) {
            estado.inicioPeriodoMs = Date.now();
        }
        actualizarReloj();
        activarWakeLock();
        estado.timerInterval = setInterval(actualizarReloj, 1000);
    }

    function detenerTimer() {
        actualizarReloj();
        if (estado.timerInterval) clearInterval(estado.timerInterval);
        estado.timerInterval = null;
        estado.inicioPeriodoMs = null;
        liberarWakeLock();
    }

    function ajustarGolRival(delta) {
        estado.golesRival = Math.max(0, estado.golesRival + delta);
        guardarEstadoLocal();
        renderMarcador();
    }

    // ==========================================
    // RENDERIZADO GENERAL
    // ==========================================
    function renderTodo() {
        renderMarcador();
        renderControlFase();
        renderJugadores();
        renderCronologia();
    }

    function renderMarcador() {
        document.getElementById("scorePropio").innerText = estado.golesPropio;
        document.getElementById("scoreRival").innerText = estado.golesRival;
        actualizarReloj();
    }

    function renderControlFase() {
        const badge = document.getElementById("badgeFase");
        const btn = document.getElementById("btnFasePrincipal");
        const btnGuardar = document.getElementById("btnAbrirCierre");

        if (estado.fase === "PREVIA") {
            badge.innerText = "ALINEACIÓN INICIAL";
            badge.className = "text-[10px] font-black px-2.5 py-1 rounded-full bg-amber-500/20 text-amber-300";
            btn.innerText = "▶ Iniciar 1er Tiempo";
            btn.className = "w-full bg-green-600 hover:bg-green-700 text-white font-black py-3.5 rounded-xl shadow-lg transition";
            btn.classList.remove("hidden");
            btnGuardar.classList.add("hidden");
        } else if (estado.fase === "1T") {
            badge.innerText = "1ER TIEMPO • EN VIVO";
            badge.className = "text-[10px] font-black px-2.5 py-1 rounded-full bg-green-500/20 text-green-400 animate-pulse";
            btn.innerText = "⏸ Terminar 1er Tiempo";
            btn.className = "w-full bg-amber-600 hover:bg-amber-700 text-white font-black py-3.5 rounded-xl shadow-lg transition";
            btn.classList.remove("hidden");
            btnGuardar.classList.add("hidden");
        } else if (estado.fase === "ENTRETIEMPO") {
            badge.innerText = "ENTRETIEMPO";
            badge.className = "text-[10px] font-black px-2.5 py-1 rounded-full bg-blue-500/20 text-blue-300";
            btn.innerText = "▶ Iniciar 2do Tiempo";
            btn.className = "w-full bg-green-600 hover:bg-green-700 text-white font-black py-3.5 rounded-xl shadow-lg transition";
            btn.classList.remove("hidden");
            btnGuardar.classList.add("hidden");
        } else if (estado.fase === "2T") {
            badge.innerText = "2DO TIEMPO • EN VIVO";
            badge.className = "text-[10px] font-black px-2.5 py-1 rounded-full bg-green-500/20 text-green-400 animate-pulse";
            btn.innerText = "🏁 Finalizar Partido";
            btn.className = "w-full bg-red-600 hover:bg-red-700 text-white font-black py-3.5 rounded-xl shadow-lg transition";
            btn.classList.remove("hidden");
            btnGuardar.classList.add("hidden");
        } else {
            badge.innerText = "PARTIDO FINALIZADO";
            badge.className = "text-[10px] font-black px-2.5 py-1 rounded-full bg-slate-700 text-slate-300";
            btn.classList.add("hidden");
            btnGuardar.classList.remove("hidden");
        }
    }

    function renderJugadores() {
        const titulares = estado.jugadores.filter(j => j.enCancha);
        const suplentes = estado.jugadores.filter(j => !j.enCancha);

        document.getElementById("cntTitulares").innerText = titulares.length;
        document.getElementById("cntSuplentes").innerText = suplentes.length;
        document.getElementById("ayudaAlineacion").innerText = estado.fase === "PREVIA"
            ? "Toca a los jugadores de abajo para pasarlos a Titulares (En Cancha)."
            : "Toca un jugador en cancha para registrar Gol, Tarjeta o Cambio.";

        const gridTit = document.getElementById("gridTitulares");
        if (titulares.length === 0) {
            gridTit.innerHTML = "<p class='col-span-3 text-center text-slate-500 text-xs py-6 border border-dashed border-slate-800 rounded-xl'>Sin titulares marcados aún</p>";
        } else {
            gridTit.innerHTML = titulares.map(j => crearCardJugador(j, true)).join("");
        }

        const gridSup = document.getElementById("gridSuplentes");
        if (suplentes.length === 0) {
            gridSup.innerHTML = "<p class='col-span-3 text-center text-slate-500 text-xs py-4'>No quedan suplentes en banca</p>";
        } else {
            gridSup.innerHTML = suplentes.map(j => crearCardJugador(j, false)).join("");
        }
    }

    function crearCardJugador(j, esTitular) {
        const borde = esTitular ? "border-green-500/60 bg-slate-900" : "border-slate-800 bg-slate-900/60 opacity-85";
        const badgeColor = esTitular ? "bg-green-600" : "bg-slate-700";
        return `
        <div onclick="clickJugador('${j.dni}')" class="rounded-xl border ${borde} overflow-hidden relative cursor-pointer active:scale-95 transition shadow">
            <span class="absolute top-1 left-1 ${badgeColor} text-white font-black text-[10px] px-1.5 py-0.5 rounded-md z-10">${j.camiseta}</span>
            <img src="${j.fotoUrl}" class="w-full h-20 object-cover bg-slate-800">
            <div class="p-1.5 text-center">
                <p class="text-[11px] font-bold text-slate-100 leading-tight truncate">${j.nombre}</p>
            </div>
        </div>`;
    }

    // ==========================================
    // INTERACCIÓN CON JUGADORES Y EVENTOS
    // ==========================================
    function clickJugador(dni) {
        const j = estado.jugadores.find(x => x.dni === dni);
        if (!j) return;

        // En fase PREVIA: tocar alterna entre Titular y Suplente
        if (estado.fase === "PREVIA") {
            j.enCancha = !j.enCancha;
            guardarEstadoLocal();
            renderJugadores();
            return;
        }

        if (estado.fase === "FINALIZADO") {
            return mostrarAlerta("El partido ya finalizó. Presione 'Guardar y Enviar al DT' para cerrar.");
        }

        if (!j.enCancha) {
            return mostrarAlerta("Este jugador está en banca. Para ingresarlo, toque al titular que sale y presione 'Sale / Cambio'.");
        }

        estado.jugadorActivoDni = dni;
        document.getElementById("modalAccionNombre").innerText = `#${j.camiseta} ${j.nombre}`;
        document.getElementById("bloqueSuplentesCambio").classList.add("hidden");
        document.getElementById("bloqueBotonesEvento").classList.remove("hidden");
        document.getElementById("modalAcciones").classList.replace("hidden", "flex");
    }

    function cerrarModalAcciones() {
        document.getElementById("modalAcciones").classList.replace("flex", "hidden");
    }

    function registrarAccion(tipo) {
        const j = estado.jugadores.find(x => x.dni === estado.jugadorActivoDni);
        if (!j) return;

        const tiempoTxt = estado.fase === "2T" ? "2T" : "1T";
        const min = minutoActual();

        estado.eventos.push({
            id: "EV_" + Date.now() + "_" + Math.random().toString(36).slice(2, 6),
            tiempo: tiempoTxt,
            minuto: `${tiempoTxt} ${min}'`,
            tipo: tipo,
            dni: j.dni,
            nombre: j.nombre
        });

        if (tipo === "Gol") estado.golesPropio++;
        guardarEstadoLocal();
        cerrarModalAcciones();
        renderTodo();
    }

    function abrirSelectorSustitucion() {
        const suplentes = estado.jugadores.filter(j => !j.enCancha);
        const cont = document.getElementById("listaSuplentesCambio");

        if (suplentes.length === 0) {
            cont.innerHTML = "<p class='text-center text-slate-400 text-xs py-4'>No hay suplentes disponibles en banca.</p>";
        } else {
            cont.innerHTML = suplentes.map(s => `
                <button onclick="confirmarCambio('${s.dni}')" class="w-full flex items-center justify-between p-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 border border-slate-700 transition text-left">
                    <div class="flex items-center gap-3">
                        <img src="${s.fotoUrl}" class="w-9 h-9 rounded-full object-cover bg-slate-700">
                        <div>
                            <p class="text-xs font-bold text-white">${s.nombre}</p>
                            <p class="text-[10px] text-slate-400 font-bold">Camiseta #${s.camiseta}</p>
                        </div>
                    </div>
                    <span class="bg-green-600 text-white text-[10px] font-black px-2.5 py-1 rounded-lg">⬆ Entra</span>
                </button>
            `).join("");
        }

        document.getElementById("bloqueBotonesEvento").classList.add("hidden");
        document.getElementById("bloqueSuplentesCambio").classList.remove("hidden");
    }

    function confirmarCambio(dniEntra) {
        const jSale = estado.jugadores.find(x => x.dni === estado.jugadorActivoDni);
        const jEntra = estado.jugadores.find(x => x.dni === dniEntra);
        if (!jSale || !jEntra) return;

        const tiempoTxt = estado.fase === "2T" ? "2T" : "1T";
        const min = minutoActual();

        jSale.enCancha = false;
        jEntra.enCancha = true;

        estado.eventos.push({
            id: "EV_" + Date.now() + "_" + Math.random().toString(36).slice(2, 6),
            tiempo: tiempoTxt,
            minuto: `${tiempoTxt} ${min}'`,
            tipo: "Cambio",
            dni: jSale.dni,
            nombre: jSale.nombre,
            dniEntra: jEntra.dni,
            nombreEntra: jEntra.nombre
        });

        guardarEstadoLocal();
        cerrarModalAcciones();
        renderTodo();
    }

    // ==========================================
    // CRONOLOGÍA Y DESHACER
    // ==========================================
    function renderCronologia() {
        const cont = document.getElementById("listaCronologia");
        const btnDeshacer = document.getElementById("btnDeshacerUltimo");

        if (estado.eventos.length === 0) {
            btnDeshacer.classList.add("hidden");
            cont.innerHTML = "<p class='text-center text-slate-500 text-xs py-4'>Aún no hay eventos registrados.</p>";
            return;
        }

        btnDeshacer.classList.remove("hidden");

        const iconos = {
            "Gol": "⚽",
            "Asistencia": "👟",
            "Amarilla": "🟨",
            "Roja": "🟥",
            "Cambio": "🔄"
        };

        cont.innerHTML = [...estado.eventos].reverse().map(ev => {
            const desc = ev.tipo === "Cambio"
                ? `<span class="text-red-400">⬇ ${ev.nombre}</span> / <span class="text-green-400">⬆ ${ev.nombreEntra}</span>`
                : `<span class="text-white font-bold">${ev.tipo}</span> — ${ev.nombre}`;

            return `
            <div class="flex items-center justify-between bg-slate-900 border border-slate-800 rounded-xl p-2.5">
                <div class="flex items-center gap-2.5 text-xs">
                    <span class="bg-slate-800 text-slate-300 font-mono text-[10px] font-bold px-2 py-1 rounded-md">${ev.minuto}</span>
                    <span>${iconos[ev.tipo] || "•"}</span>
                    <div class="leading-tight">${desc}</div>
                </div>
                <button onclick="eliminarEvento('${ev.id}')" class="text-slate-400 hover:text-red-400 text-xs font-bold px-2 py-1 rounded-lg bg-slate-800" title="Deshacer esta acción">✕</button>
            </div>`;
        }).join("");
    }

    function deshacerUltimo() {
        if (estado.eventos.length === 0) return;
        const ultimo = estado.eventos[estado.eventos.length - 1];
        eliminarEvento(ultimo.id);
    }

    function eliminarEvento(id) {
        const idx = estado.eventos.findIndex(e => e.id === id);
        if (idx === -1) return;
        const ev = estado.eventos[idx];

        if (ev.tipo === "Gol") {
            estado.golesPropio = Math.max(0, estado.golesPropio - 1);
        } else if (ev.tipo === "Cambio") {
            const jSale = estado.jugadores.find(x => x.dni === ev.dni);
            const jEntra = estado.jugadores.find(x => x.dni === ev.dniEntra);
            if (jSale) jSale.enCancha = true;
            if (jEntra) jEntra.enCancha = false;
        }

        estado.eventos.splice(idx, 1);
        guardarEstadoLocal();
        renderTodo();
    }

    // ==========================================
    // CIERRE Y ENVÍO A APROBACIÓN DEL DT
    // ==========================================
    function abrirModalCierre() {
        document.getElementById("cierreGolesPropio").innerText = estado.golesPropio;
        document.getElementById("cierreGolesRival").value = estado.golesRival;
        document.getElementById("modalCierre").classList.replace("hidden", "flex");
    }
    function cerrarModalCierre() {
        document.getElementById("modalCierre").classList.replace("flex", "hidden");
    }

    async function enviarPartidoParaAprobacion() {
        const golesRival = document.getElementById("cierreGolesRival").value;
        const incidencias = document.getElementById("cierreIncidencias").value.trim();
        const nombrePadre = document.getElementById("cierreNombrePadre").value.trim();

        if (golesRival === "") return mostrarAlerta("Ingrese el marcador del equipo rival.");
        if (!nombrePadre) return mostrarAlerta("Ingrese sus nombres y apellidos para registrar quién llevó el control.");

        const btn = document.getElementById("btnConfirmarEnvio");
        btn.innerText = "Enviando al DT...";
        btn.disabled = true;

        // Expandir eventos de cambio en Sale / Entra para Eventos_Juego
        let eventosPlanos = [];
        estado.eventos.forEach(ev => {
            if (ev.tipo === "Cambio") {
                eventosPlanos.push({ minuto: ev.minuto, tipoEvento: "Sale", dniJugador: ev.dni });
                eventosPlanos.push({ minuto: ev.minuto, tipoEvento: "Entra", dniJugador: ev.dniEntra });
            } else {
                eventosPlanos.push({ minuto: ev.minuto, tipoEvento: ev.tipo, dniJugador: ev.dni });
            }
        });

        const titularesIniciales = estado.jugadores.filter(j => j.titularInicial).map(j => j.dni);

        try {
            const formData = new URLSearchParams();
            formData.append("action", "finalizarPartidoPadre");
            formData.append("token", TOKEN);
            formData.append("golesPropio", estado.golesPropio);
            formData.append("golesRival", golesRival);
            formData.append("incidencias", incidencias);
            formData.append("padreRegistrador", nombrePadre);
            formData.append("titulares", JSON.stringify(titularesIniciales));
            formData.append("eventos", JSON.stringify(eventosPlanos));

            const res = await fetch(URL_BACKEND, { method: "POST", body: formData });
            const data = JSON.parse(await res.text());
            if (!data.exito) throw new Error(data.error || "Error al guardar el partido.");

            limpiarEstadoLocal();
            liberarWakeLock();
            cerrarModalCierre();
            document.getElementById("appView").innerHTML = `
                <div class="bg-slate-900 border border-green-700 rounded-2xl p-8 text-center mt-10">
                    <p class="text-5xl mb-3">✅</p>
                    <h2 class="text-2xl font-black text-white mb-2">¡Registro Enviado!</h2>
                    <p class="text-sm text-slate-300 mb-4">Marcador final: <b>${estado.golesPropio} - ${golesRival}</b></p>
                    <p class="text-xs text-slate-400">Gracias, <b>${nombrePadre}</b>. El reporte ha pasado a revisión y aprobación final del Entrenador (DT).</p>
                </div>`;
        } catch (e) {
            mostrarAlerta(e.message);
            btn.innerText = "💾 Guardar y Enviar al DT";
            btn.disabled = false;
        }
    }
</script>

<!-- LOADER -->
<div id="loaderView" class="max-w-md mx-auto pt-20 text-center">
    <p class="text-slate-400 text-sm font-bold animate-pulse">Cargando Mesa de Control...</p>
</div>

<!-- APP PRINCIPAL -->
<div id="appView" class="hidden max-w-md mx-auto space-y-4">

    <!-- MARCADOR Y RELOJ -->
    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 shadow-xl sticky top-2 z-30">
        <div class="flex justify-between items-center mb-3">
            <span id="badgeFase" class="text-[10px] font-black px-2.5 py-1 rounded-full bg-amber-500/20 text-amber-300">ALINEACIÓN</span>
            <span id="relojDisplay" class="font-mono text-2xl font-black text-green-400">00:00</span>
        </div>

        <div class="grid grid-cols-3 items-center text-center bg-slate-950 rounded-xl p-3 border border-slate-800 mb-3">
            <div>
                <p class="text-[10px] text-slate-400 font-bold uppercase">Nosotros</p>
                <p id="scorePropio" class="text-3xl font-black text-white">0</p>
            </div>
            <div class="text-slate-600 font-black text-sm">VS</div>
            <div>
                <p id="lblRivalMarcador" class="text-[10px] text-slate-400 font-bold uppercase truncate">Rival</p>
                <div class="flex items-center justify-center gap-2 mt-0.5">
                    <button onclick="ajustarGolRival(-1)" class="w-6 h-6 rounded bg-slate-800 text-slate-300 font-bold text-xs">-</button>
                    <p id="scoreRival" class="text-3xl font-black text-white">0</p>
                    <button onclick="ajustarGolRival(1)" class="w-6 h-6 rounded bg-slate-800 text-slate-300 font-bold text-xs">+</button>
                </div>
            </div>
        </div>

        <button id="btnFasePrincipal" onclick="avanzarFase()" class="w-full bg-green-600 hover:bg-green-700 text-white font-black py-3.5 rounded-xl shadow-lg transition">▶ Iniciar 1er Tiempo</button>
        <button id="btnAbrirCierre" onclick="abrirModalCierre()" class="hidden w-full bg-blue-600 hover:bg-blue-700 text-white font-black py-3.5 rounded-xl shadow-lg transition">💾 Guardar y Enviar al DT</button>
    </div>

    <p id="ayudaAlineacion" class="text-[11px] text-slate-400 text-center px-2"></p>

    <!-- TITULARES (EN CANCHA) -->
    <div>
        <div class="flex justify-between items-center mb-2 px-1">
            <h3 class="text-xs font-black uppercase tracking-wider text-green-400">🟢 En Cancha (Titulares)</h3>
            <span id="cntTitulares" class="text-[10px] font-black bg-green-500/20 text-green-300 px-2 py-0.5 rounded-full">0</span>
        </div>
        <div id="gridTitulares" class="grid grid-cols-3 gap-2"></div>
    </div>

    <!-- SUPLENTES (BANCA) -->
    <div>
        <div class="flex justify-between items-center mb-2 px-1">
            <h3 class="text-xs font-black uppercase tracking-wider text-slate-400">🪑 Banca (Suplentes)</h3>
            <span id="cntSuplentes" class="text-[10px] font-black bg-slate-800 text-slate-300 px-2 py-0.5 rounded-full">0</span>
        </div>
        <div id="gridSuplentes" class="grid grid-cols-3 gap-2"></div>
    </div>

    <!-- CRONOLOGÍA -->
    <div class="pt-2 border-t border-slate-800">
        <div class="flex justify-between items-center mb-2 px-1">
            <h3 class="text-xs font-black uppercase tracking-wider text-slate-300">🕒 Cronología del Partido</h3>
            <button id="btnDeshacerUltimo" onclick="deshacerUltimo()" class="hidden text-[10px] font-bold bg-amber-500/20 text-amber-300 px-2.5 py-1 rounded-lg hover:bg-amber-500/30 transition">↩️ Deshacer último</button>
        </div>
        <div id="listaCronologia" class="space-y-2"></div>
    </div>

</div>

<!-- MODAL ACCIONES DE JUGADOR -->
<div id="modalAcciones" class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm z-50 items-end sm:items-center justify-center p-4">
    <div class="bg-slate-900 border border-slate-700 w-full max-w-sm rounded-2xl p-5 shadow-2xl">
        <div class="flex justify-between items-center mb-4">
            <h3 id="modalAccionNombre" class="text-lg font-black text-white">Jugador</h3>
            <button onclick="cerrarModalAcciones()" class="text-slate-400 bg-slate-800 p-1.5 rounded-full text-xs">✕</button>
        </div>

        <div id="bloqueBotonesEvento" class="grid grid-cols-2 gap-2.5">
            <button onclick="registrarAccion('Gol')" class="bg-green-600 hover:bg-green-500 text-white font-black py-3.5 rounded-xl">⚽ GOL</button>
            <button onclick="registrarAccion('Asistencia')" class="bg-blue-600 hover:bg-blue-500 text-white font-black py-3.5 rounded-xl">👟 P. Gol</button>
            <button onclick="registrarAccion('Amarilla')" class="bg-amber-500 hover:bg-amber-400 text-slate-950 font-black py-3.5 rounded-xl">🟨 Amarilla</button>
            <button onclick="registrarAccion('Roja')" class="bg-red-600 hover:bg-red-500 text-white font-black py-3.5 rounded-xl">🟥 Roja</button>
            <button onclick="abrirSelectorSustitucion()" class="col-span-2 bg-slate-700 hover:bg-slate-600 text-white font-black py-3 rounded-xl mt-1">🔄 Sale / Hacer Cambio</button>
        </div>

        <div id="bloqueSuplentesCambio" class="hidden space-y-2">
            <p class="text-xs text-slate-400 font-bold mb-2">Seleccione el suplente que ingresa:</p>
            <div id="listaSuplentesCambio" class="space-y-2 max-h-60 overflow-y-auto"></div>
            <button onclick="document.getElementById('bloqueSuplentesCambio').classList.add('hidden'); document.getElementById('bloqueBotonesEvento').classList.remove('hidden');" class="w-full text-xs text-slate-400 font-bold py-2 mt-2">← Volver</button>
        </div>
    </div>
</div>

<!-- MODAL CIERRE DEL PARTIDO -->
<div id="modalCierre" class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm z-50 items-center justify-center p-4">
    <div class="bg-slate-900 border border-slate-700 w-full max-w-sm rounded-2xl p-5 shadow-2xl space-y-4">
        <div class="flex justify-between items-center">
            <h3 class="text-lg font-black text-white">🏁 Finalizar y Enviar al DT</h3>
            <button onclick="cerrarModalCierre()" class="text-slate-400 bg-slate-800 p-1.5 rounded-full text-xs">✕</button>
        </div>

        <div class="grid grid-cols-2 gap-3 bg-slate-950 p-3 rounded-xl border border-slate-800 text-center">
            <div>
                <p class="text-[10px] text-slate-400 font-bold uppercase">Nuestros Goles</p>
                <p id="cierreGolesPropio" class="text-2xl font-black text-green-400 mt-1">0</p>
            </div>
            <div>
                <label class="block text-[10px] text-slate-400 font-bold uppercase mb-1">Goles del Rival</label>
                <input type="number" id="cierreGolesRival" min="0" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-1.5 text-center text-xl font-black text-white">
            </div>
        </div>

        <div>
            <label class="block text-[10px] font-bold text-slate-400 uppercase mb-1">Incidencias / Observaciones (Opcional)</label>
            <textarea id="cierreIncidencias" rows="2" placeholder="Ej. Lesión en el 2T, gol anulado, etc." class="w-full bg-slate-800 border border-slate-700 rounded-xl p-2.5 text-xs text-white"></textarea>
        </div>

        <div>
            <label class="block text-[10px] font-bold text-slate-400 uppercase mb-1">Nombres y Apellidos del Padre (Obligatorio)</label>
            <input type="text" id="cierreNombrePadre" placeholder="Ej. Carlos Mendoza" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-2.5 text-sm font-bold text-white">
        </div>

        <button id="btnConfirmarEnvio" onclick="enviarPartidoParaAprobacion()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-black py-3.5 rounded-xl shadow-lg transition">💾 Guardar y Enviar al DT</button>
    </div>
</div>

<!-- MODAL ALERTA -->
<div id="modalAlerta" class="hidden fixed inset-0 bg-black/70 z-[100] items-center justify-center p-4">
    <div class="bg-slate-900 border border-slate-700 rounded-2xl p-5 max-w-xs w-full text-center">
        <p id="alertaTexto" class="text-sm text-slate-200 font-medium mb-4"></p>
        <button onclick="cerrarAlerta()" class="w-full bg-blue-600 text-white font-bold py-2.5 rounded-xl text-sm">Entendido</button>
    </div>
</div>

</body>
</html>

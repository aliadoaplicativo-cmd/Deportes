<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>Registro de Partido - Padre</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-2">

<script>
    // 👇 PEGA AQUÍ TU URL DE GOOGLE APPS SCRIPT 👇
    const URL_BACKEND = "https://script.google.com/macros/s/AKfycbxZ3I-TpP19nuQ5Lls_kEVi1CL7Fqg2V3-hY7yeYBgbCCU9nAkbtS2xOpkHEzmKTC2hQg/exec";

    const params = new URLSearchParams(window.location.search);
    const token = params.get('token');

    window.onload = async function() {
        if(!token) {
            document.getElementById("status").innerHTML = "❌ Token no encontrado en el enlace.";
            return;
        }

        try {
            const res = await fetch(`${URL_BACKEND}?action=validarToken&token=${token}`);
            const data = await res.json();
            
            if(data.valido) {
                document.getElementById("loader").classList.add("hidden");
                document.getElementById("panelJuego").classList.remove("hidden");
            } else {
                document.getElementById("status").innerHTML = "❌ Partido finalizado o enlace incorrecto.";
            }
        } catch (error) {
            document.getElementById("status").innerHTML = "Error de conexión.";
        }
    };

    async function registrar(tipo) {
        const dni = document.getElementById("inputDni").value;
        const minuto = document.getElementById("inputMinuto").value;

        if(!dni || !minuto) {
            alert("Por favor ingrese el Minuto y el DNI del jugador.");
            return;
        }

        const msgDiv = document.getElementById("notificacion");
        msgDiv.innerText = "Enviando...";
        msgDiv.classList.remove("hidden", "text-green-600", "text-red-600");
        msgDiv.classList.add("text-blue-600");

        try {
            const res = await fetch(`${URL_BACKEND}?action=registrarEvento&token=${token}&minuto=${minuto}&tipoEvento=${tipo}&dniJugador=${dni}`);
            const data = await res.json();
            
            if(data.exito) {
                msgDiv.innerText = `✅ ${tipo} registrado correctamente al min ${minuto}.`;
                msgDiv.classList.replace("text-blue-600", "text-green-600");
                // Limpiar inputs
                document.getElementById("inputDni").value = "";
            } else {
                msgDiv.innerText = "❌ Error: " + (data.error || "Desconocido");
                msgDiv.classList.replace("text-blue-600", "text-red-600");
            }
        } catch (error) {
            msgDiv.innerText = "❌ Error de conexión.";
            msgDiv.classList.replace("text-blue-600", "text-red-600");
        }
    }
</script>

<div class="max-w-sm mx-auto mt-4 text-center">
    <h1 class="text-2xl font-bold text-gray-800 mb-2">⚽ Registro en Vivo</h1>
    
    <div id="loader" class="bg-white p-4 rounded shadow text-lg font-bold text-gray-500">
        <span id="status">Validando enlace del encuentro...</span>
    </div>

    <div id="panelJuego" class="hidden">
        <div class="bg-white p-4 rounded-lg shadow-md mb-4 text-left">
            <label class="block text-gray-700 font-bold mb-1">DNI del Jugador Involucrado:</label>
            <input type="number" id="inputDni" placeholder="Ej. 70123456" class="w-full border p-3 rounded mb-3 text-xl text-center">
            
            <label class="block text-gray-700 font-bold mb-1">Minuto del partido:</label>
            <input type="number" id="inputMinuto" placeholder="Ej. 15" class="w-full border p-3 rounded mb-2 text-xl text-center">
        </div>

        <div class="grid grid-cols-2 gap-3">
            <button onclick="registrar('Gol')" class="bg-green-500 text-white font-bold py-6 rounded-lg text-2xl shadow active:bg-green-600">⚽ GOL</button>
            <button onclick="registrar('Asistencia')" class="bg-blue-500 text-white font-bold py-6 rounded-lg text-xl shadow active:bg-blue-600">👟 P. Gol</button>
            <button onclick="registrar('Amarilla')" class="bg-yellow-400 text-yellow-900 font-bold py-6 rounded-lg text-xl shadow active:bg-yellow-500">🟨 Amarilla</button>
            <button onclick="registrar('Roja')" class="bg-red-600 text-white font-bold py-6 rounded-lg text-xl shadow active:bg-red-700">🟥 Roja</button>
            <button onclick="registrar('Entra')" class="bg-gray-700 text-white font-bold py-4 rounded-lg text-lg shadow active:bg-gray-800 col-span-2">🔄 Cambio (Entra a Cancha)</button>
        </div>

        <div id="notificacion" class="mt-4 font-bold text-lg hidden"></div>
    </div>
</div>

</body>
</html>
